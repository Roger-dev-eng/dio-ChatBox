<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Chatbot Groq</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="chat-container">

        <div class="header">
            Chatbot
        </div>

        <div id="messages" class="messages"></div>

        <div class="input-container">
            <input 
                id="msgInput" 
                type="text" 
                placeholder="Digite uma mensagem..." 
                autocomplete="off"
            >
            <div class="input-actions">
                <label class="file-upload secondary-btn" for="fileInput">
                    <input id="fileInput" type="file" accept=".txt,.md,.csv,.json" hidden>
                    <span>📎 Arquivo</span>
                </label>
                <button id="uploadBtn" class="secondary-btn" type="button">Enviar arquivo</button>
                <button id="clearBtn" class="secondary-btn" type="button">Novo chat</button>
                <button id="sendBtn" type="button">Enviar</button>
            </div>
        </div>

    </div>

    <script src="/script.js"></script>
</body>
</html>
