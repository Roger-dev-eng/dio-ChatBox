<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Chatbot Groq</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="chat-container">

        <div class="header">
            <span>Chatbot</span>
            <button id="clearBtn" class="secondary-btn header-btn" type="button">Novo chat</button>
        </div>

        <div id="messages" class="messages"></div>

        <div class="input-container">
            <label class="file-upload" for="fileInput" title="Adicionar arquivo">
                <input id="fileInput" type="file" accept=".txt,.md,.csv,.json,.pdf,.docx" hidden>
                <span>+</span>
            </label>
            <input 
                id="msgInput" 
                type="text" 
                placeholder="Digite uma mensagem..." 
                autocomplete="off"
            >
            <button id="sendBtn" type="button">Enviar</button>
        </div>

    </div>

    <script src="/script.js"></script>
</body>
</html>
